<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting...</title>
  <script>
    const oldBase = '/terrain-atmospheric-Intrinsic-decomposition';
    const newBase = '/terrain-atmospheric-intrinsic-decomposition';
    const path = window.location.pathname;
    if (path.startsWith(oldBase)) {
      const suffix = path.slice(oldBase.length);
      window.location.replace(newBase + suffix + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <p>
    Redirecting to
    <a href="https://sttkw.github.io/terrain-atmospheric-intrinsic-decomposition/">
      https://sttkw.github.io/terrain-atmospheric-intrinsic-decomposition/
    </a>
  </p>
</body>
</html>
